# Inside your server { } block. Direct requests to protected files must never succeed.
location ^~ /wp-content/uploads/woocommerce_uploads/ {
    deny all;
    return 403;
}
# If using WooCommerce "X-Accel-Redirect" download method, add an internal location instead:
# location ^~ /woocommerce_protected/ { internal; alias /var/www/html/wp-content/uploads/woocommerce_uploads/; }
